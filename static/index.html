<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp - Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h5><i class="bi bi-chat-dots-fill"></i> ChatApp</h5>
                <div class="user-info">
                    <span id="currentUsername" class="fw-bold"></span>
                    <button class="btn btn-sm btn-outline-danger ms-2" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </div>
            </div>
            
            <!-- Online Users -->
            <div class="sidebar-section">
                <h6><i class="bi bi-people-fill"></i> Online Users</h6>
                <div id="onlineUsersList" class="list-group list-group-flush"></div>
            </div>
            
            <!-- DM Conversations -->
            <div class="sidebar-section">
                <h6><i class="bi bi-envelope-fill"></i> Direct Messages</h6>
                <div id="dmList" class="list-group list-group-flush"></div>
            </div>
        </div>
        
        <!-- Main Chat Area -->
        <div class="chat-main">
            <!-- Chat Header -->
            <div class="chat-header">
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm btn-link d-md-none" onclick="toggleSidebar()">
                        <i class="bi bi-list"></i>
                    </button>
                    <h5 id="chatTitle" class="mb-0"><i class="bi bi-globe"></i> Global Chat</h5>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span id="connectionStatus" class="connection-status small"></span>
                    <button class="btn btn-sm btn-outline-secondary" onclick="loadMessages()">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
            </div>
            
            <!-- Messages Area -->
            <div class="chat-messages" id="chatMessages">
                <div class="text-center text-muted py-5">
                    <i class="bi bi-chat-text display-1"></i>
                    <p class="mt-3">Loading messages...</p>
                </div>
            </div>
            
            <!-- Typing Indicator -->
            <div id="typingIndicator" class="typing-indicator px-3 py-1 small text-muted"></div>

            <!-- Message Input -->
            <div class="chat-input">
                <form id="messageForm" class="d-flex gap-2">
                    <input type="text" 
                           class="form-control form-control-lg" 
                           id="messageInput" 
                           placeholder="Type a message..."
                           autocomplete="off"
                           required>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-send-fill"></i> Send
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <!-- DM Modal -->
    <div class="modal fade" id="dmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Direct Message</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="dmModalBody">
                    <!-- DM messages loaded here -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
